# =============================================================================
# SONAR-PROJECT.PROPERTIES — Configuracion del analisis SonarQube
# =============================================================================
# Configuracion del analisis estatico para el proyecto Veltri Minimarket.
# Analiza todo el codigo Terraform e infraestructura del repositorio.
# =============================================================================

# Identificador del proyecto (debe coincidir con el Project key en SonarQube)
sonar.projectKey=proyecto-infra
sonar.projectName=Veltri Minimarket - Infraestructura
sonar.projectVersion=1.0

# Donde esta el codigo fuente (. = toda la raiz del repositorio)
sonar.sources=.

# Codificacion de los archivos
sonar.sourceEncoding=UTF-8

# URL del servidor SonarQube local
sonar.host.url=http://localhost:9000

# Excluir carpetas que no aportan al analisis de calidad
sonar.exclusions=**/.terraform/**,**/*.tfstate,**/*.tfstate.backup,**/node_modules/**